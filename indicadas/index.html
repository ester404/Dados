<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oficinas Indicadas — Dados Bancários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <a class="voltar" href="../index.html">← Voltar</a>
  <div class="oficina-icon-row">🔧🏍️🚗</div>
  <h1>Oficinas Indicadas</h1>
  <p>Referência rápida para pagamentos e transferências. Busque pelo nome da oficina e copie os dados com um toque.</p>
</header>

<div class="container">
  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="busca" placeholder="Buscar oficina..." autocomplete="off">
    </div>
  </div>

  <div class="contador" id="contador"></div>

  <div class="grid" id="grid"></div>
  <div class="vazio" id="vazio" style="display:none;">Nenhuma oficina encontrada com esse nome.</div>
</div>

<footer>Cartilha de uso interno — Departamento de Notas</footer>

<script src="js/script.js"></script>
</body>
</html>
